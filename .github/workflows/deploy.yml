name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/configure-pages@v5

      - name: Work out site URL and base path
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          # Site URL: repo variable SITE_URL (custom domain) or the default github.io address
          SITE="${CUSTOM_SITE_URL:-https://${OWNER}.github.io}"
          # Base path: repo variable BASE_PATH, else "/" for a user site, else "/<repo>"
          if [ -n "$CUSTOM_BASE_PATH" ]; then
            BASE="$CUSTOM_BASE_PATH"
          elif [ "${REPO,,}" = "${OWNER}.github.io" ]; then
            BASE="/"
          else
            BASE="/${REPO}"
          fi
          echo "SITE_URL=$SITE" >> "$GITHUB_ENV"
          echo "BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "Building for $SITE with base $BASE"

      - run: npm install
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
